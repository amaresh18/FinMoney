# Note: GitHub Actions provides free unlimited runners for public repositories.
# If a private repository fails with spending limit errors, consider switching visibility
# to Public in GitHub Settings or use Codemagic (mac_mini_m2) / local builds.
name: Android CI/CD Release Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.0
        with:
          accept-android-sdk-licenses: true
          packages: platforms;android-36 build-tools;35.0.0 platform-tools

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Prepare CI config files
        run: |
          cp .env.example .env
          if [ ! -f app/google-services.json ]; then
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_number": "000000000000",' \
              '    "project_id": "finmoney-ci-placeholder",' \
              '    "storage_bucket": "finmoney-ci-placeholder.appspot.com"' \
              '  },' \
              '  "client": [' \
              '    {' \
              '      "client_info": {' \
              '        "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",' \
              '        "android_client_info": { "package_name": "com.aistudio.finmoney.vqpz" }' \
              '      },' \
              '      "oauth_client": [],' \
              '      "api_key": [{ "current_key": "AIzaSyCiPlaceholderKeyNotForProduction" }],' \
              '      "services": { "appinvite_service": { "other_platform_oauth_client": [] } }' \
              '    }' \
              '  ],' \
              '  "configuration_version": "1"' \
              '}' > app/google-services.json
          fi

      - name: Decode Release Keystore (if present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Release key configured."
          else
            echo "Notice: KEYSTORE_BASE64 secret not set. Build will use debug keystore."
          fi

      - name: Clean and Build Bundle & APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
