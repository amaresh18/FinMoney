workflows:
  android-release:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.finmoney.vqpz"
    scripts:
      - name: Set Java 17 location
        script: |
          if [ -d "/usr/libexec/java_home" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          fi
          echo "JAVA_HOME is $JAVA_HOME"
      - name: Decode Keystore
        script: |
          if [ -n "$CM_KEYSTORE_BASE64" ]; then
            echo "$CM_KEYSTORE_BASE64" | base64 --decode > $CM_BUILD_DIR/my-upload-key.jks
            export KEYSTORE_PATH="$CM_BUILD_DIR/my-upload-key.jks"
            echo "Release key decoded successfully."
          else
            echo "No release key provided. Build will fall back to debug signing."
          fi
      - name: Grant Execute Permission for Gradle Wrapper
        script: |
          chmod +x ./gradlew || true
      - name: Clean and Build Release Bundle
        script: |
          ./gradlew clean --no-daemon
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
